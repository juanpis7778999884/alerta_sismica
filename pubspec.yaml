name: alerta_sismica
description: "Monitoreo sísmico, contactos de emergencia y SOS con funcionamiento offline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  latlong2: ^0.10.1
  permission_handler: ^13.0.2
  provider: ^6.1.5+1
  shared_preferences: ^2.2.2
  http: ^1.1.0
  url_launcher: ^6.1.12
  crypto: ^3.0.8
  uuid: ^4.6.0
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^23.0.2
  share_plus: ^13.3.1
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
